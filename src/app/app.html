<header>
  <app-logo [size]="36" />
  <div class="brand">
    <h1>Unified AI</h1>
    <p>Every AI in one chat. The best one answers.</p>
  </div>
  <div class="meta">
    <span class="team">by Team Unity</span>
    @if (store.mode() === 'mock') {
      <span
        class="badge"
        title="Answers are simulated on the server. Set UNIFIED_AI_MODE=openrouter for real models."
      >
        Demo mode
      </span>
    }
  </div>
</header>

<main>
  <app-chat />
  <app-sidebar />
</main>

<div class="toast" [class.show]="store.toast()?.visible" role="status" aria-live="polite">
  {{ store.toast()?.text }}
</div>
