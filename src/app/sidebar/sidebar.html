<div class="tabs" role="tablist" aria-label="Side panel" (keydown)="onKeydown($event)">
  @for (t of tabs; track t.id) {
    <button
      type="button"
      role="tab"
      [id]="'tab-' + t.id"
      [attr.aria-selected]="tab() === t.id"
      [attr.aria-controls]="'pane-' + t.id"
      [attr.tabindex]="tab() === t.id ? 0 : -1"
      [class.act]="tab() === t.id"
      (click)="tab.set(t.id)"
    >
      {{ t.label }}
    </button>
  }
</div>

<div class="pane" role="tabpanel" [id]="'pane-' + tab()" [attr.aria-labelledby]="'tab-' + tab()">
  @switch (tab()) {
    @case ('routing') {
      <app-routing-panel />
    }
    @case ('benchmarks') {
      <app-benchmarks-panel />
    }
    @case ('stats') {
      <app-stats-panel />
    }
  }
</div>
